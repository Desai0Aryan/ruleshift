<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#0f1226"/>
  <text x="450" y="36" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">RULESHIFT: screen layout sketch (not final UI)</text>

  <!-- Puzzle screen -->
  <rect x="60" y="70" width="240" height="520" rx="30" fill="#151a3d" stroke="#6c7bff" stroke-width="2"/>
  <text x="180" y="105" text-anchor="middle" fill="#cfd3ff" font-size="14">PUZZLE  00:23</text>
  <circle cx="110" cy="200" r="14" fill="#3da5ff"/>
  <rect x="130" y="330" width="100" height="12" rx="6" fill="#8890d9" transform="rotate(-18 180 336)"/>
  <circle cx="240" cy="440" r="20" fill="none" stroke="#ffd54a" stroke-width="5"/>
  <rect x="90" y="520" width="180" height="40" rx="20" fill="#6c7bff"/>
  <text x="180" y="546" text-anchor="middle" fill="#fff" font-size="16">Retry</text>

  <!-- Rule picker -->
  <rect x="330" y="70" width="240" height="520" rx="30" fill="#151a3d" stroke="#ff7ad9" stroke-width="2"/>
  <text x="450" y="105" text-anchor="middle" fill="#ffb3ec" font-size="14">SOLVED! CHANGE ONE RULE</text>
  <g fill="#1f2563" stroke="#ff7ad9">
    <rect x="352" y="140" width="196" height="64" rx="14"/><rect x="352" y="220" width="196" height="64" rx="14"/>
    <rect x="352" y="300" width="196" height="64" rx="14"/><rect x="352" y="380" width="196" height="64" rx="14"/>
  </g>
  <g fill="#fff" font-size="15" text-anchor="middle">
    <text x="450" y="178">Reverse gravity</text><text x="450" y="258">Duplicate objects</text>
    <text x="450" y="338">Speed mode</text><text x="450" y="418">Teleport swap</text>
  </g>
  <rect x="372" y="520" width="156" height="40" rx="20" fill="#ff7ad9"/>
  <text x="450" y="546" text-anchor="middle" fill="#0f1226" font-size="16" font-weight="700">Send to friend</text>

  <!-- Chain replay -->
  <rect x="600" y="70" width="240" height="520" rx="30" fill="#151a3d" stroke="#7affc4" stroke-width="2"/>
  <text x="720" y="105" text-anchor="middle" fill="#b5ffe0" font-size="14">CHAIN REPLAY</text>
  <g stroke="#7affc4" stroke-width="2" fill="#1f2563">
    <rect x="640" y="140" width="160" height="70" rx="12"/><rect x="640" y="240" width="160" height="70" rx="12"/>
    <rect x="640" y="340" width="160" height="70" rx="12"/><rect x="640" y="440" width="160" height="70" rx="12"/>
  </g>
  <g fill="#fff" font-size="13" text-anchor="middle">
    <text x="720" y="180">1. Original</text><text x="720" y="280">2. + Reverse gravity</text>
    <text x="720" y="380">3. + Duplicate</text><text x="720" y="480">4. + Teleport</text>
  </g>
  <rect x="650" y="530" width="140" height="36" rx="18" fill="#7affc4"/>
  <text x="720" y="554" text-anchor="middle" fill="#0f1226" font-size="14" font-weight="700">Share replay</text>
</svg>
